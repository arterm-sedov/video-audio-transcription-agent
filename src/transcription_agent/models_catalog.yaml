# Offline VLM model catalog (fallback when live discovery is unreachable).
# Canonical shape: models-first, each model lists its supported providers.
# price: estimated USD per 1M input tokens (used for cheapest-first ranking).
# Capability note: audio-from-video is model-specific. Ratings are model-level
# (same across Polza/OpenRouter/Gemini). Rank: quality, then price, then speed.
# 2026-08-18 VPN-off Polza 60s probe recovered the gold greeting on every
# advertised audio+video Gemini except google/gemini-2.5-flash SOCKS upload
# (empty speech; other three cells gold). 2026-08-19 5-minute Polza clip:
# google/gemini-3.1-flash-lite remains selector rank 1 (fastest strong usable),
# while google/gemini-2.5-flash is the configured default after successful
# recent full-recording use. It is the cheapest usable 5-minute job ($0.0034)
# with mixed historical reliability. google/gemini-2.5-flash-lite hallucinated an hour of
# "Да." (3453 segments). xiaomi/mimo-v2.5 returned empty speech. Chinese VLMs
# on Polza (Qwen, MiniMax, Kimi, GLM, Ernie, StepFun) do not advertise
# audio+video, so they stay excluded. openai/gpt-5.2 and gpt-5.4 advertise
# audio+video but Polza returns 400 no video endpoints. Claude: same 400.
# Muse Spark: OpenRouter 403 missing 18+ attestation (account gate).
# OpenRouter Gemini: 403 TOS from this RU/VPN account; keep in roster for
# native western hosting (Hugging Face Spaces). OpenRouter must stay direct;
# pointing it at the Polza SOCKS host is an invalid route. Gemini models are
# region-gated: reachable from a western egress and rejected from RU-egress
# machines, so keep them in the roster.
# Fields:
#   tested: true       verified to transcribe speech from video (evidence-grounded
#                      primer; these always appear first/kept in the union).
#   excluded: true     verified unsuitable for transcription (tested vision-only,
#                      no audible audio, or official docs confirm no audio+video
#                      input); dropped from selectors even if live discovery
#                      reports them as media-capable.
#   russian_quality: strong|good|unknown  research grade for Russian speech;
#                    strong means direct project evidence, good means documented
#                    multilingual/audio support, unknown means no reliable
#                    Russian transcription evidence yet.
#   speed: fast|medium|slow|unknown  wall-clock bucket from the 5-minute Polza
#                    clip (fast <30s, medium 30-90s, slow >90s).
#   speed_s: numeric median seconds used as the speed tie-breaker.
#   reliability: high|mixed|low|unknown  documented, not used in ranking.
# Ranking: tested, russian_quality, price, speed_s.

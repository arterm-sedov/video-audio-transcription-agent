# Offline VLM model catalog (fallback when live discovery is unreachable).
# Canonical shape: models-first, each model lists its supported providers.
# price: estimated USD per 1M input tokens (used for cheapest-first ranking).
# Capability note: audio-from-video is model-specific on OpenRouter. Verified
# on a real meeting capture (2026-08-17): minimax/minimax-m3 and
# qwen/qwen3.6-plus transcribe speech from inline video; moonshotai/kimi-k3 and
# z-ai/glm-4.6v are vision-only; qwen/qwen3.8-max and stepfun/step-3.7-flash
# report no audible audio. Gemini models work normally but are region-gated:
# reachable from a western egress (e.g. Hugging Face Spaces) and rejected from
# RU-egress machines, so keep them in the roster.
# Fields:
#   tested: true       verified to transcribe speech from video (evidence-grounded
#                      primer; these always appear first/kept in the union).
#   excluded: true     tested and found unsuitable for transcription (vision-only
#                      or no audible audio); dropped from selectors even if live
#                      discovery reports them as media-capable.
